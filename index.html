<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语四级 · 3000 核心词库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233b6ef5'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#eef2f9; --bg2:#dfe7f5; --card:#fff; --text:#1c2434; --muted:#6b7891;
    --line:#e3e8f1; --brand:#3b6ef5; --brand-soft:#eaf0ff;
    --ok:#12a06a; --ok-soft:#e6f7ef; --bad:#e0463c; --bad-soft:#fdecea;
    --warn:#c8871a; --warn-soft:#fdf4e3; --radius:16px;
    --shadow:0 10px 30px rgba(24,40,80,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 600px at 15% -10%,var(--bg2),var(--bg)) fixed;
    color:var(--text); min-height:100vh; padding:26px 16px 70px; line-height:1.6;
  }
  .wrap{max-width:900px;margin:0 auto}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:23px;margin:0;letter-spacing:.5px}
  h1 span{color:var(--brand)}
  .sub{font-size:13px;color:var(--muted);margin-top:4px}

  .tabs{display:flex;gap:4px;background:#f1f4fa;border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px;overflow-x:auto}
  .tabs button{
    flex:1;min-width:76px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;
    padding:9px 10px;border-radius:11px;cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .tabs button:hover{color:var(--text)}
  .tabs button.on{background:#fff;color:var(--brand);font-weight:600;box-shadow:0 1px 5px rgba(24,40,80,.13)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
  .panel + .panel{margin-top:14px}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--text);font:inherit;font-size:13px;
    padding:7px 13px;border-radius:10px;cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .btn.primary:hover{background:#2f5fe0;color:#fff}
  .btn.danger:hover{border-color:var(--bad);color:var(--bad)}
  .btn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line);color:var(--muted);background:#fff}
  .btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}

  input[type=text],input[type=search],select{
    font:inherit;font-size:14px;color:var(--text);background:#fff;
    border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;outline:none;transition:.15s;
  }
  input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  input[type=search]{flex:1;min-width:180px}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{
    border:1px solid var(--line);background:#fff;color:var(--muted);font:inherit;font-size:12px;
    padding:3px 9px;border-radius:99px;cursor:pointer;transition:.15s;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}

  .bar{height:7px;background:#e6ebf5;border-radius:99px;overflow:hidden;margin:0 0 4px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5b8bff,#3b6ef5);border-radius:99px;transition:width .35s}
  .barmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:14px}

  /* ---------- 词表 ---------- */
  .row{
    display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;
    padding:11px 12px;border-radius:12px;border:1px solid transparent;transition:.12s;
  }
  .row:hover{background:#f8faff;border-color:var(--line)}
  .row + .row{border-top:1px solid #f0f3f9;border-top-left-radius:0;border-top-right-radius:0}
  .wline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .word{font-size:16.5px;font-weight:700;letter-spacing:.2px}
  .ph{font-size:12px;color:var(--muted);font-family:"Segoe UI",system-ui,sans-serif}
  .pos{font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:1px 6px;border-radius:6px}
  .cn{font-size:14px;color:#39445c;margin-top:2px}
  .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .tag.t1{background:var(--bad-soft);color:var(--bad)}
  .tag.t2{background:var(--brand-soft);color:var(--brand)}
  .tag.t3{background:#f1f4fa;color:var(--muted)}
  .rowacts{display:flex;align-items:center;gap:5px}
  .sbtn{
    width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:#fff;
    font:inherit;font-size:13px;line-height:1;cursor:pointer;color:var(--muted);transition:.13s;
  }
  .sbtn:hover{border-color:var(--brand);color:var(--brand)}
  .sbtn.s1.on{background:var(--bad);border-color:var(--bad);color:#fff}
  .sbtn.s2.on{background:var(--warn);border-color:var(--warn);color:#fff}
  .sbtn.s3.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .row.st3{background:#f6fdfa}
  .row.st1{background:#fff8f7}
  .empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:14px}
  .empty .big{font-size:34px;margin-bottom:8px}

  /* ---------- 闪卡 ---------- */
  .deck{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .fc{perspective:1400px;margin:6px 0 14px}
  .fc-inner{position:relative;width:100%;min-height:270px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;cursor:pointer}
  .fc.flip .fc-inner{transform:rotateY(180deg)}
  .fc-face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:26px;text-align:center;
  }
  .fc-back{transform:rotateY(180deg);background:linear-gradient(180deg,#fbfcff,#f4f7ff)}
  .fc-word{font-size:40px;font-weight:800;letter-spacing:.5px;word-break:break-word}
  .fc-ph{font-size:15px;color:var(--muted)}
  .fc-pos{font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:2px 10px;border-radius:99px}
  .fc-cn{font-size:22px;font-weight:600;line-height:1.7}
  .fc-hint{font-size:12.5px;color:var(--muted);margin-top:4px}
  .fc-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .fc-acts .btn{padding:10px 20px;font-size:14px;border-radius:12px}
  .fc-acts .b1:hover{border-color:var(--bad);color:var(--bad)}
  .fc-acts .b2:hover{border-color:var(--warn);color:var(--warn)}
  .fc-acts .b3:hover{border-color:var(--ok);color:var(--ok)}
  .fc-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:10px}

  /* ---------- 测验 ---------- */
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .qchip{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:#f1f4fa;color:var(--muted)}
  .qchip.ok{background:var(--ok-soft);color:var(--ok)}
  .qchip.bad{background:var(--bad-soft);color:var(--bad)}
  .qtext{font-size:26px;font-weight:700;margin:8px 0 6px;line-height:1.5;text-align:center;word-break:break-word}
  .qtext.small{font-size:19px;font-weight:600}
  .qsub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:20px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    border:1.5px solid var(--line);background:#fff;color:var(--text);
    font:inherit;font-size:15.5px;padding:13px 15px;border-radius:12px;cursor:pointer;transition:.15s;
  }
  .opt:hover:not(.locked){border-color:#b9c9f5;background:#fafbff;transform:translateX(2px)}
  .opt .key{flex:0 0 26px;height:26px;border-radius:8px;background:#f1f4fa;color:var(--muted);font-size:13px;font-weight:700;display:grid;place-items:center}
  .opt .txt{flex:1;padding-top:1px}
  .opt.locked{cursor:default}
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .key{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrong .key{background:var(--bad);color:#fff}
  .opt.dim{opacity:.55}
  .spellbox{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
  .spellbox input{font-size:20px;text-align:center;letter-spacing:2px;padding:12px 16px;min-width:280px}
  .explain{
    margin-top:16px;border-left:3px solid var(--brand);background:#f7f9ff;
    border-radius:0 12px 12px 0;padding:13px 16px;font-size:14.5px;color:#39445c;animation:fade .25s ease;
  }
  .explain b{color:var(--brand)}
  .explain .verdict{display:block;font-weight:700;margin-bottom:5px;font-size:14px}
  .explain .verdict.ok{color:var(--ok)}
  .explain .verdict.no{color:var(--bad)}
  @keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .score{text-align:center;padding:26px 10px}
  .score .num{font-size:52px;font-weight:800;color:var(--brand);line-height:1.1}
  .score .txt{color:var(--muted);font-size:14px;margin-top:6px}
  .wronglist{margin-top:18px;text-align:left;border-top:1px solid var(--line);padding-top:12px}
  .wronglist .it{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;border-bottom:1px dashed #eef1f8}
  .wronglist .it b{color:var(--bad)}

  /* ---------- 统计 ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:#f8faff;border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat .n{font-size:26px;font-weight:800;line-height:1.2}
  .stat .l{font-size:12.5px;color:var(--muted);margin-top:2px}
  .stat.ok .n{color:var(--ok)} .stat.warn .n{color:var(--warn)} .stat.bad .n{color:var(--bad)} .stat.brand .n{color:var(--brand)}
  .lettbars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 18px}
  .lb{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .lb .k{width:14px;font-weight:700;color:var(--muted)}
  .lb .t{flex:1;height:6px;background:#eef1f8;border-radius:99px;overflow:hidden}
  .lb .t i{display:block;height:100%;background:linear-gradient(90deg,#8fb0ff,#3b6ef5)}
  .lb .v{width:52px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .sect{font-size:14px;font-weight:700;margin:20px 0 10px}

  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:#1c2434;color:#fff;font-size:13.5px;padding:9px 18px;border-radius:99px;
    transition:.25s;box-shadow:0 8px 24px rgba(24,40,80,.28);z-index:99;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .kbd{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:#fafbff}
  @media (max-width:620px){
    .row{grid-template-columns:1fr}
    .rowacts{justify-content:flex-start}
    .fc-word{font-size:32px}
    .qtext{font-size:22px}
    /* 标签页：5 个 tab 在手机上等分铺满，不横向溢出 */
    .tabs{gap:2px;padding:3px;overflow:visible}
    .tabs button{flex:1 1 0;min-width:0;font-size:13px;padding:9px 4px}
    /* 字母筛选：加大触控目标 */
    .chips{gap:6px}
    .chips .chip{padding:7px 12px;font-size:13.5px}
    /* 工具栏控件换行铺满，便于点按 */
    .toolbar{gap:8px}
    .toolbar input[type=search]{flex:1 1 100%;min-width:0}
    .toolbar select{flex:1 1 calc(50% - 4px);min-width:0}
    .toolbar .spacer{display:none}
    #libcount{flex:1 1 100%;text-align:right}
    /* 词条操作按钮加大到触控尺寸 */
    .sbtn{width:40px;height:40px;border-radius:11px;font-size:15px}
    .rowacts{gap:8px}
    /* 闪卡评分按钮加大 */
    .fc-acts button{padding:12px 18px;font-size:15px}
    header.top{gap:10px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>英语四级 · <span>核心词库</span></h1>
      <div class="sub" id="subline">正在加载词库…</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="btnSpeakAll">🔊 发音开关</button>
      <button class="btn danger" id="btnReset">重置进度</button>
    </div>
  </header>

  <div class="bar"><i id="topbar"></i></div>
  <div class="barmeta">
    <span id="metaLeft">—</span>
    <span id="metaRight">—</span>
  </div>

  <nav class="tabs" id="tabs">
    <button data-tab="lib" class="on">词库</button>
    <button data-tab="card">闪卡</button>
    <button data-tab="quiz">测验</button>
    <button data-tab="wrong">错词本</button>
    <button data-tab="stat">统计</button>
  </nav>

  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>

/* ==================== 状态 ==================== */
const LS = "cet4-3000-v1";
const LEVEL = {1:"不认识",2:"模糊",3:"已掌握"};
let store = { st:{}, wr:{}, seen:{}, days:{}, speak:true };

function load(){
  try{
    const raw = localStorage.getItem(LS);
    if(raw){ const o = JSON.parse(raw); store = Object.assign(store, o); }
  }catch(e){}
  store.st = store.st || {}; store.wr = store.wr || {}; store.seen = store.seen || {}; store.days = store.days || {};
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(store)); }catch(e){} }

const todayKey = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function touchDay(){ const k = todayKey(); store.days[k] = (store.days[k]||0) + 1; }
function mark(word, lv){
  store.st[word] = lv;
  store.seen[word] = (store.seen[word]||0) + 1;
  touchDay(); save(); paintHeader();
}
function markWrong(word){ store.wr[word] = (store.wr[word]||0) + 1; save(); }
function unmark(word){ delete store.st[word]; save(); paintHeader(); }

/* ==================== 数据索引 ==================== */
const W = WORDS.map(a => ({ w:a[0], ph:a[1], pos:a[2], cn:a[3], tag:a[4], l:a[0][0].toUpperCase() }));
const BY_WORD = new Map(W.map(x => [x.w, x]));
const LETTERS = [...new Set(W.map(x => x.l))].sort();
const TAGS = ["高频","核心","一般"];

const lv = w => store.st[w] || 0;
const wrongCount = w => store.wr[w] || 0;
const isWrong = w => wrongCount(w) > 0;

function counts(){
  let m=0, mid=0, bad=0, unseen=0;
  for(const x of W){
    const l = lv(x.w);
    if(l===3) m++; else if(l===2) mid++; else if(l===1) bad++; else unseen++;
  }
  return {total:W.length, mastered:m, fuzzy:mid, weak:bad, unseen, done:m+mid+bad, wrong:W.filter(x=>isWrong(x.w)).length};
}

/* ==================== 工具 ==================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const tagCls = t => t==="高频" ? "t1" : (t==="核心" ? "t2" : "t3");

let toastTimer=null;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1600); }

let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices() || []; }catch(e){ voices = []; } }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(word){
  if(!store.speak || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US"; u.rate = 0.9;
    const v = voices.find(x => /en[-_]US/i.test(x.lang)) || voices.find(x => /^en/i.test(x.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ==================== 顶部进度 ==================== */
function paintHeader(){
  const c = counts();
  $("#subline").textContent = "共 " + c.total + " 词 · 四级大纲核心词（含音标 / 词性 / 中文释义 / 高频标签）";
  const pct = c.total ? (c.mastered / c.total * 100) : 0;
  $("#topbar").style.width = pct.toFixed(1) + "%";
  $("#metaLeft").textContent = "已掌握 " + c.mastered + " / " + c.total + "（" + pct.toFixed(1) + "%）";
  const td = store.days[todayKey()] || 0;
  $("#metaRight").textContent = "今日已复习 " + td + " 次 · 错词 " + c.wrong + " 个";
}

/* ==================== 路由 ==================== */
let tab = "lib";
function go(t){ tab = t; $$("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab===t)); render(); window.scrollTo({top:0,behavior:"smooth"}); }
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if(b) go(b.dataset.tab); });

function render(){
  // 用一个没有事件监听的空节点替换 #view，避免重复渲染时监听器叠加
  const old = $("#view");
  const v = old.cloneNode(false);
  old.replaceWith(v);
  if(tab==="lib") renderLib(v);
  else if(tab==="card") renderCard(v);
  else if(tab==="quiz") renderQuiz(v);
  else if(tab==="wrong") renderWrong(v);
  else renderStat(v);
}

/* ==================== 词库 ==================== */
const libState = { q:"", letter:"ALL", tag:"ALL", status:"ALL", shown:150 };
let libList = [];

function libFilter(){
  const q = libState.q.trim().toLowerCase();
  libList = W.filter(x => {
    if(libState.letter!=="ALL" && x.l!==libState.letter) return false;
    if(libState.tag!=="ALL" && x.tag!==libState.tag) return false;
    const l = lv(x.w);
    if(libState.status==="NEW" && l!==0) return false;
    if(libState.status==="DOING" && !(l===1||l===2)) return false;
    if(libState.status==="OK" && l!==3) return false;
    if(q && !(x.w.includes(q) || x.cn.includes(q))) return false;
    return true;
  });
}

function rowHTML(x){
  const l = lv(x.w);
  return '<div class="row'+(l===3?" st3":(l===1?" st1":""))+'" data-w="'+esc(x.w)+'">'
    + '<div><div class="wline"><span class="word">'+esc(x.w)+'</span><span class="ph">'+esc(x.ph)+'</span>'
    + '<span class="pos">'+esc(x.pos)+'</span><span class="tag '+tagCls(x.tag)+'">'+esc(x.tag)+'</span>'
    + (isWrong(x.w)?'<span class="tag t1">错'+wrongCount(x.w)+'</span>':'')+'</div>'
    + '<div class="cn">'+esc(x.cn)+'</div></div>'
    + '<div class="rowacts">'
    + '<button class="sbtn" data-act="say" title="朗读">🔊</button>'
    + '<button class="sbtn s1'+(l===1?" on":"")+'" data-act="1" title="不认识">✗</button>'
    + '<button class="sbtn s2'+(l===2?" on":"")+'" data-act="2" title="模糊">?</button>'
    + '<button class="sbtn s3'+(l===3?" on":"")+'" data-act="3" title="已掌握">✓</button>'
    + '</div></div>';
}

function renderLib(v){
  v.innerHTML =
    '<div class="panel">'
    + '<div class="toolbar">'
    +   '<input type="search" id="q" placeholder="搜索单词或中文释义…" value="'+esc(libState.q)+'">'
    +   '<select id="fstatus">'
    +     ['ALL:全部状态','NEW:未学','DOING:学习中','OK:已掌握'].map(o=>{const [k,t]=o.split(":");return '<option value="'+k+'"'+(libState.status===k?" selected":"")+'>'+t+'</option>';}).join("")
    +   '</select>'
    +   '<select id="ftag"><option value="ALL">全部标签</option>'+TAGS.map(t=>'<option value="'+t+'"'+(libState.tag===t?" selected":"")+'>'+t+'</option>').join("")+'</select>'
    +   '<div class="spacer" style="flex:1"></div>'
    +   '<span style="font-size:12.5px;color:var(--muted)" id="libcount"></span>'
    + '</div>'
    + '<div class="chips" id="letterchips">'
    +   '<button class="chip'+(libState.letter==="ALL"?" on":"")+'" data-l="ALL">全部</button>'
    +   LETTERS.map(l=>'<button class="chip'+(libState.letter===l?" on":"")+'" data-l="'+l+'">'+l+'</button>').join("")
    + '</div>'
    + '<div id="liblist"></div>'
    + '<div style="text-align:center;margin-top:14px"><button class="btn" id="more">显示更多</button></div>'
    + '</div>';

  libFilter();
  paintLib();

  $("#q").addEventListener("input", e => { libState.q = e.target.value; libState.shown = 150; libFilter(); paintLib(); });
  $("#fstatus").addEventListener("change", e => { libState.status = e.target.value; libState.shown = 150; libFilter(); paintLib(); });
  $("#ftag").addEventListener("change", e => { libState.tag = e.target.value; libState.shown = 150; libFilter(); paintLib(); });
  $("#letterchips").addEventListener("click", e => {
    const b = e.target.closest("button[data-l]"); if(!b) return;
    libState.letter = b.dataset.l; libState.shown = 150;
    $$("#letterchips .chip").forEach(c => c.classList.toggle("on", c.dataset.l===libState.letter));
    libFilter(); paintLib();
  });
  $("#liblist").addEventListener("click", e => {
    const row = e.target.closest(".row"); if(!row) return;
    const word = row.dataset.w, b = e.target.closest("button[data-act]");
    if(!b){ speak(word); return; }
    const act = b.dataset.act;
    if(act==="say"){ speak(word); return; }
    const n = +act, cur = lv(word);
    if(cur===n){ unmark(word); } else { mark(word, n); }
    libFilter(); paintLib(); paintHeader();
  });
  $("#more").addEventListener("click", () => { libState.shown += 200; paintLib(); });
}

function paintLib(){
  const box = $("#liblist");
  const part = libList.slice(0, libState.shown);
  $("#libcount").textContent = "命中 " + libList.length + " 词，已显示 " + part.length;
  box.innerHTML = part.length ? part.map(rowHTML).join("") : '<div class="empty"><div class="big">🔍</div>没有符合条件的单词</div>';
  $("#more").style.display = libState.shown < libList.length ? "" : "none";
}

/* ==================== 闪卡 ==================== */
const cardState = { scope:"ALL", queue:[], i:0, flipped:false };

function scopeWords(scope){
  if(scope==="ALL") return W.slice();
  if(scope==="高频") return W.filter(x=>x.tag==="高频");
  if(scope==="核心") return W.filter(x=>x.tag==="核心");
  if(scope==="NEW") return W.filter(x=>lv(x.w)===0);
  if(scope==="DOING") return W.filter(x=>{const l=lv(x.w);return l===1||l===2;});
  if(scope==="WRONG") return W.filter(x=>isWrong(x.w));
  return W.slice();
}
const SCOPE_LABEL = {ALL:"全部词", "高频":"高频词", "核心":"核心词", NEW:"未学词", DOING:"学习中", WRONG:"错词本"};

function renderCard(v){
  const pool = scopeWords(cardState.scope);
  v.innerHTML =
    '<div class="panel">'
    + '<div class="deck">'
    +   '<select id="cscope">'+Object.keys(SCOPE_LABEL).map(k=>'<option value="'+k+'"'+(cardState.scope===k?" selected":"")+'>'+SCOPE_LABEL[k]+'</option>').join("")+'</select>'
    +   '<button class="btn" id="cshuffle">打乱顺序</button>'
    +   '<button class="btn" id="crestart">重新开始</button>'
    +   '<div style="flex:1"></div>'
    +   '<span style="font-size:12.5px;color:var(--muted)">'+(pool.length?("本轮 "+pool.length+" 词"):"该范围暂无单词")+'</span>'
    + '</div>'
    + '<div class="fc" id="fc"><div class="fc-inner" id="fcin"></div></div>'
    + '<div class="fc-acts">'
    +   '<button class="btn b1" data-lv="1">✗ 不认识 <span class="kbd">1</span></button>'
    +   '<button class="btn b2" data-lv="2">? 模糊 <span class="kbd">2</span></button>'
    +   '<button class="btn b3" data-lv="3">✓ 认识 <span class="kbd">3</span></button>'
    + '</div>'
    + '<div class="fc-meta"><span>空格 / 点击卡片：翻面</span><span>← → ：上一个 / 下一个</span></div>'
    + '</div>';

  if(!cardState.queue.length || cardState.queueScope !== cardState.scope){
    cardState.queue = shuffle(pool); cardState.i = 0; cardState.queueScope = cardState.scope;
  }
  paintCard();

  $("#cscope").addEventListener("change", e => { cardState.scope = e.target.value; cardState.queue=[]; render(); });
  $("#cshuffle").addEventListener("click", () => { cardState.queue = shuffle(scopeWords(cardState.scope)); cardState.i=0; cardState.flipped=false; paintCard(); });
  $("#crestart").addEventListener("click", () => { cardState.queue = scopeWords(cardState.scope).slice(); cardState.i=0; cardState.flipped=false; paintCard(); });
  $("#fc").addEventListener("click", flipCard);
  v.querySelector(".fc-acts").addEventListener("click", e => {
    const b = e.target.closest("button[data-lv]"); if(!b) return;
    gradeCard(+b.dataset.lv);
  });
}

function paintCard(){
  const fc = $("#fc"), inner = $("#fcin");
  if(!fc) return;
  fc.classList.toggle("flip", cardState.flipped);
  const x = cardState.queue[cardState.i];
  if(!x){ inner.innerHTML = '<div class="fc-face"><div class="fc-word" style="font-size:22px">🎉</div><div class="fc-hint">该范围已过完，换个范围或点「重新开始」</div></div>'; return; }
  const l = lv(x.w);
  inner.innerHTML =
    '<div class="fc-face">'
    + '<div class="fc-word">'+esc(x.w)+'</div>'
    + '<div class="fc-ph">'+esc(x.ph)+'</div>'
    + '<div class="fc-pos">'+esc(x.pos)+'</div>'
    + '<div class="fc-hint">点击卡片或按空格查看释义 · '+(cardState.i+1)+' / '+cardState.queue.length+'</div>'
    + '</div>'
    + '<div class="fc-face fc-back">'
    + '<div class="fc-cn">'+esc(x.cn)+'</div>'
    + '<div class="fc-ph" style="font-size:18px;font-weight:700;color:#1c2434">'+esc(x.w)+'</div>'
    + '<div class="fc-ph">'+esc(x.ph)+' · '+esc(x.pos)+'</div>'
    + '<div class="fc-hint">'+(l?("上次标记："+LEVEL[l]):"尚未标记")+' · 按 1 / 2 / 3 评分</div>'
    + '</div>';
}

function flipCard(){ cardState.flipped = !cardState.flipped; const fc=$("#fc"); if(fc) fc.classList.toggle("flip", cardState.flipped); }
function nextCard(){ cardState.i++; cardState.flipped=false; paintCard(); }
function prevCard(){ if(cardState.i>0) cardState.i--; cardState.flipped=false; paintCard(); }
function gradeCard(n){
  const x = cardState.queue[cardState.i]; if(!x) return;
  mark(x.w, n);
  if(n===1) markWrong(x.w);
  toast(LEVEL[n] + "：" + x.w);
  nextCard();
}

/* ==================== 测验 ==================== */
const quiz = { mode:"en2cn", scope:"ALL", size:20, running:false, list:[], i:0, right:0, wrong:[], answered:false, cur:null, chosen:-1, input:"" };

function renderQuiz(v){
  if(!quiz.running){ v.innerHTML = quizSetupHTML(); bindQuizSetup(v); return; }
  v.innerHTML = quizRunHTML();
  bindQuizRun(v);
}

function quizSetupHTML(){
  const n = scopeWords(quiz.scope).length;
  return '<div class="panel">'
    + '<div class="sect" style="margin-top:0">选择题型</div>'
    + '<div class="chips" id="qmode">'
    +   [["en2cn","英 → 中（看单词选释义）"],["cn2en","中 → 英（看释义选单词）"],["spell","拼写（看释义写单词）"]]
        .map(([k,t])=>'<button class="chip'+(quiz.mode===k?" on":"")+'" data-m="'+k+'">'+t+'</button>').join("")
    + '</div>'
    + '<div class="sect">出题范围</div>'
    + '<div class="chips" id="qscope">'
    +   Object.keys(SCOPE_LABEL).map(k=>'<button class="chip'+(quiz.scope===k?" on":"")+'" data-s="'+k+'">'+SCOPE_LABEL[k]+'</button>').join("")
    + '</div>'
    + '<div class="sect">题量</div>'
    + '<div class="chips" id="qsize">'
    +   [10,20,30,50,100].map(k=>'<button class="chip'+(quiz.size===k?" on":"")+'" data-n="'+k+'">'+k+' 题</button>').join("")
    + '</div>'
    + '<div class="toolbar" style="margin-top:18px">'
    +   '<button class="btn primary" id="qstart" '+(n===0?"disabled":"")+'>开始测验</button>'
    +   '<span style="font-size:12.5px;color:var(--muted)">当前范围可用 '+n+' 词</span>'
    + '</div>'
    + '<div style="font-size:12.5px;color:var(--muted);margin-top:6px">提示：答错的词会自动进入「错词本」，可随时专项复习。</div>'
    + '</div>';
}

function bindQuizSetup(v){
  $("#qmode").addEventListener("click", e => { const b=e.target.closest("button[data-m]"); if(!b) return; quiz.mode=b.dataset.m; render(); });
  $("#qscope").addEventListener("click", e => { const b=e.target.closest("button[data-s]"); if(!b) return; quiz.scope=b.dataset.s; render(); });
  $("#qsize").addEventListener("click", e => { const b=e.target.closest("button[data-n]"); if(!b) return; quiz.size=+b.dataset.n; render(); });
  $("#qstart").addEventListener("click", startQuiz);
}

function startQuiz(){
  const pool = scopeWords(quiz.scope);
  if(!pool.length){ toast("该范围暂无单词"); return; }
  const n = Math.min(quiz.size, pool.length);
  quiz.list = shuffle(pool).slice(0, n);
  quiz.i = 0; quiz.right = 0; quiz.wrong = []; quiz.answered = false; quiz.chosen = -1; quiz.input = "";
  quiz.running = true;
  nextQuestion();
}

function buildQuestion(x){
  if(quiz.mode==="spell") return { x:x, opts:null, ans:-1 };
  const samePos = W.filter(y => y.w!==x.w && y.pos===x.pos);
  const others = shuffle((samePos.length>=3 ? samePos : W.filter(y=>y.w!==x.w))).slice(0,3);
  const all = shuffle([x].concat(others));
  const ans = all.findIndex(y => y.w===x.w);
  return { x:x, opts:all, ans:ans };
}

function nextQuestion(){
  if(quiz.i >= quiz.list.length){ quiz.running = false; render(); return; }
  quiz.cur = buildQuestion(quiz.list[quiz.i]);
  quiz.answered = false; quiz.chosen = -1; quiz.input = "";
  render();
  const inp = $("#spellinput"); if(inp) inp.focus();
}

function quizRunHTML(){
  const q = quiz.cur;
  if(!q) return '<div class="panel"><div class="empty">没有题目</div></div>';
  const x = q.x;
  const total = quiz.list.length, no = quiz.i+1;
  let head = '<div class="qhead"><span class="qchip">第 '+no+' / '+total+' 题</span>'
    + '<span class="qchip">'+SCOPE_LABEL[quiz.scope]+'</span>'
    + '<span class="qchip">'+(quiz.mode==="en2cn"?"英→中":(quiz.mode==="cn2en"?"中→英":"拼写"))+'</span>'
    + '<span class="qchip ok">✓ '+quiz.right+'</span>'
    + '<span class="qchip bad">✗ '+quiz.wrong.length+'</span>'
    + '<div style="flex:1"></div><button class="btn sm" id="qquit">结束测验</button></div>';

  let body = "";
  if(quiz.mode==="en2cn"){
    body = '<div class="qtext">'+esc(x.w)+'</div><div class="qsub">'+esc(x.ph)+' · '+esc(x.pos)+'</div>'
      + '<div class="opts">'+q.opts.map((o,i)=>{
          let cls="opt";
          if(quiz.answered){ cls+=" locked"; if(i===q.ans) cls+=" correct"; else if(i===quiz.chosen) cls+=" wrong"; else cls+=" dim"; }
          return '<button class="'+cls+'" data-i="'+i+'" '+(quiz.answered?"disabled":"")+'><span class="key">'+["A","B","C","D"][i]+'</span><span class="txt">'+esc(o.cn)+'</span></button>';
        }).join("")+'</div>';
  } else if(quiz.mode==="cn2en"){
    body = '<div class="qtext small">'+esc(x.cn)+'</div><div class="qsub">选出对应的英文单词（'+esc(x.pos)+'）</div>'
      + '<div class="opts">'+q.opts.map((o,i)=>{
          let cls="opt";
          if(quiz.answered){ cls+=" locked"; if(i===q.ans) cls+=" correct"; else if(i===quiz.chosen) cls+=" wrong"; else cls+=" dim"; }
          return '<button class="'+cls+'" data-i="'+i+'" '+(quiz.answered?"disabled":"")+'><span class="key">'+["A","B","C","D"][i]+'</span><span class="txt">'+esc(o.w)+' <span class="ph">'+esc(o.ph)+'</span></span></button>';
        }).join("")+'</div>';
  } else {
    const hint = x.w.length<=3 ? "共 "+x.w.length+" 个字母" : x.w[0] + " " + "_ ".repeat(x.w.length-1).trim();
    body = '<div class="qtext small">'+esc(x.cn)+'</div><div class="qsub">'+esc(x.ph)+' · '+esc(x.pos)+' · '+hint+'</div>'
      + '<div class="spellbox"><input type="text" id="spellinput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入英文单词后回车"'+(quiz.answered?" disabled":"")+' value="'+esc(quiz.input)+'"></div>'
      + '<div style="text-align:center"><button class="btn primary" id="spellcheck" '+(quiz.answered?"disabled":"")+'>提交</button></div>';
  }

  let ex = "";
  if(quiz.answered){
    const ok = quiz.mode==="spell" ? quiz.input.trim().toLowerCase()===x.w : quiz.chosen===q.ans;
    ex = '<div class="explain"><span class="verdict '+(ok?"ok":"no")+'">'+(ok?"✓ 回答正确":"✗ 回答错误 —— 正确答案是 "+x.w)+'</span>'
      + '<b>'+esc(x.w)+'</b> '+esc(x.ph)+' <span class="ph">'+esc(x.pos)+'</span> —— '+esc(x.cn)
      + ' <span class="tag '+tagCls(x.tag)+'">'+esc(x.tag)+'</span></div>';
  }

  const foot = quiz.answered
    ? '<div class="toolbar" style="margin-top:16px"><div style="flex:1"></div><button class="btn primary" id="qnext">'+(quiz.i+1>=total?"查看成绩":"下一题 →")+'</button></div>'
    : '<div class="toolbar" style="margin-top:16px"><span style="font-size:12.5px;color:var(--muted)">'+(quiz.mode==="spell"?"输入后按回车提交":"点击选项作答")+'</span></div>';

  return '<div class="panel">'+head+body+ex+foot+'</div>';
}

function bindQuizRun(v){
  const q = quiz.cur;
  v.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    if(quiz.answered) return;
    quiz.chosen = +b.dataset.i;
    answer();
  }));
  const sc = $("#spellcheck");
  if(sc) sc.addEventListener("click", () => { if(!quiz.answered) answer(); });
  const si = $("#spellinput");
  if(si) si.addEventListener("keydown", e => { if(e.key==="Enter" && !quiz.answered){ e.preventDefault(); answer(); } });
  const nx = $("#qnext");
  if(nx) nx.addEventListener("click", () => { quiz.i++; nextQuestion(); });
  const qq = $("#qquit");
  if(qq) qq.addEventListener("click", () => { quiz.running=false; quiz.cur=null; render(); });
}

function answer(){
  const q = quiz.cur, x = q.x;
  if(quiz.mode==="spell"){
    const inp = $("#spellinput");
    quiz.input = inp ? inp.value : "";
  }
  quiz.answered = true;
  const ok = quiz.mode==="spell" ? quiz.input.trim().toLowerCase()===x.w : quiz.chosen===q.ans;
  if(ok){ quiz.right++; mark(x.w, 3); }
  else { quiz.wrong.push(x); markWrong(x.w); mark(x.w, 1); }
  render();
  if(quiz.mode==="spell"){ const n=$("#qnext"); if(n) n.focus(); }
}

/* ==================== 错词本 ==================== */
function renderWrong(v){
  const list = W.filter(x => isWrong(x.w)).sort((a,b) => wrongCount(b.w)-wrongCount(a.w));
  v.innerHTML = '<div class="panel">'
    + '<div class="toolbar">'
    +   '<span style="font-size:14px;font-weight:700">错词本</span>'
    +   '<span style="font-size:12.5px;color:var(--muted)">共 '+list.length+' 词 · 答错自动收录</span>'
    +   '<div style="flex:1"></div>'
    +   '<button class="btn" id="wcard" '+(list.length?"":"disabled")+'>用闪卡复习</button>'
    +   '<button class="btn" id="wquiz" '+(list.length?"":"disabled")+'>开始测验</button>'
    +   '<button class="btn danger" id="wclear" '+(list.length?"":"disabled")+'>清空</button>'
    + '</div>'
    + (list.length
        ? list.map(x => '<div class="row" data-w="'+esc(x.w)+'">'
            + '<div><div class="wline"><span class="word">'+esc(x.w)+'</span><span class="ph">'+esc(x.ph)+'</span>'
            + '<span class="pos">'+esc(x.pos)+'</span><span class="tag t1">错 '+wrongCount(x.w)+' 次</span>'
            + '<span class="tag '+tagCls(x.tag)+'">'+esc(x.tag)+'</span></div>'
            + '<div class="cn">'+esc(x.cn)+'</div></div>'
            + '<div class="rowacts"><button class="sbtn" data-act="say">🔊</button><button class="sbtn" data-act="rm" title="移出错词本">🗑</button></div>'
            + '</div>').join("")
        : '<div class="empty"><div class="big">🎉</div>错词本是空的，继续保持！</div>')
    + '</div>';

  v.addEventListener("click", e => {
    const row = e.target.closest(".row"); if(!row) return;
    const word = row.dataset.w, b = e.target.closest("button[data-act]");
    if(!b){ speak(word); return; }
    if(b.dataset.act==="say"){ speak(word); return; }
    if(b.dataset.act==="rm"){ delete store.wr[word]; if(lv(word)===1) unmark(word); save(); render(); paintHeader(); toast("已移出：" + word); }
  });
  const wc = $("#wcard"); if(wc) wc.addEventListener("click", () => { cardState.scope="WRONG"; cardState.queue=[]; go("card"); });
  const wq = $("#wquiz"); if(wq) wq.addEventListener("click", () => { quiz.scope="WRONG"; quiz.running=false; go("quiz"); });
  const wcl = $("#wclear"); if(wcl) wcl.addEventListener("click", () => { if(confirm("确定清空错词本？学习状态不会丢失。")){ store.wr={}; save(); render(); paintHeader(); toast("错词本已清空"); } });
}

/* ==================== 统计 ==================== */
function renderStat(v){
  const c = counts();
  const byTag = t => { const l = W.filter(x=>x.tag===t); const m = l.filter(x=>lv(x.w)===3).length; return {n:l.length, m}; };
  const days = Object.keys(store.days).sort().slice(-14);

  let html = '<div class="panel">'
    + '<div class="stats">'
    +   '<div class="stat brand"><div class="n">'+c.total+'</div><div class="l">词库总词数</div></div>'
    +   '<div class="stat ok"><div class="n">'+c.mastered+'</div><div class="l">已掌握</div></div>'
    +   '<div class="stat warn"><div class="n">'+c.fuzzy+'</div><div class="l">模糊</div></div>'
    +   '<div class="stat bad"><div class="n">'+c.weak+'</div><div class="l">不认识</div></div>'
    +   '<div class="stat"><div class="n">'+c.unseen+'</div><div class="l">未学习</div></div>'
    +   '<div class="stat bad"><div class="n">'+c.wrong+'</div><div class="l">错词本</div></div>'
    + '</div>';

  html += '<div class="sect">标签进度</div><div class="lettbars">'
    + TAGS.map(t => { const o = byTag(t); const p = o.n?o.m/o.n*100:0;
        return '<div class="lb"><span class="k">'+t[0]+'</span><span class="t"><i style="width:'+p.toFixed(1)+'%"></i></span><span class="v">'+o.m+'/'+o.n+'</span></div>'; }).join("")
    + '</div>';

  html += '<div class="sect">字母进度（已掌握 / 该字母词数）</div><div class="lettbars">'
    + LETTERS.map(l => {
        const arr = W.filter(x=>x.l===l); const m = arr.filter(x=>lv(x.w)===3).length; const p = arr.length?m/arr.length*100:0;
        return '<div class="lb"><span class="k">'+l+'</span><span class="t"><i style="width:'+p.toFixed(1)+'%"></i></span><span class="v">'+m+'/'+arr.length+'</span></div>';
      }).join("")
    + '</div>';

  html += '<div class="sect">最近 14 天复习次数</div>'
    + (days.length
        ? '<div class="lettbars">'+days.map(d=>'<div class="lb"><span class="k" style="width:74px;font-weight:400">'+d.slice(5)+'</span><span class="t"><i style="width:'+Math.min(100,(store.days[d]||0)/1.5)+'%"></i></span><span class="v">'+store.days[d]+' 次</span></div>').join("")+'</div>'
        : '<div style="font-size:13px;color:var(--muted)">还没有记录，去闪卡或测验里练几组吧。</div>');

  html += '<div class="sect">数据管理</div>'
    + '<div class="toolbar">'
    +   '<button class="btn" id="exp">导出进度</button>'
    +   '<button class="btn" id="impbtn">导入进度</button>'
    +   '<input type="file" id="impfile" accept=".json" style="display:none">'
    +   '<button class="btn" id="expcsv">导出词表 CSV</button>'
    +   '<div style="flex:1"></div>'
    +   '<span style="font-size:12.5px;color:var(--muted)">数据保存在本机浏览器 localStorage，不上传</span>'
    + '</div></div>';

  v.innerHTML = html;

  $("#exp").addEventListener("click", () => download("cet4-progress-" + todayKey() + ".json", JSON.stringify(store, null, 2), "application/json"));
  $("#impbtn").addEventListener("click", () => $("#impfile").click());
  $("#impfile").addEventListener("change", e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { try{ const o = JSON.parse(r.result); store = Object.assign({st:{},wr:{},seen:{},days:{},speak:true}, o); save(); paintHeader(); render(); toast("进度已导入"); }catch(err){ toast("文件格式不正确"); } };
    r.readAsText(f);
  });
  $("#expcsv").addEventListener("click", () => {
    const rows = [["单词","音标","词性","中文释义","标签","学习状态","错误次数"]];
    W.forEach(x => rows.push([x.w, x.ph, x.pos, x.cn, x.tag, LEVEL[lv(x.w)]||"未学习", String(wrongCount(x.w))]));
    const csv = "\uFEFF" + rows.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(",")).join("\r\n");
    download("cet4-3000-words.csv", csv, "text/csv");
  });
}

function download(name, text, type){
  const blob = new Blob([text], {type:type + ";charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ==================== 全局交互 ==================== */
document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if(tab!=="card") return;
  if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flipCard(); }
  else if(e.key==="1") gradeCard(1);
  else if(e.key==="2") gradeCard(2);
  else if(e.key==="3") gradeCard(3);
  else if(e.key==="ArrowRight") nextCard();
  else if(e.key==="ArrowLeft") prevCard();
});

$("#btnSpeakAll").addEventListener("click", () => {
  store.speak = !store.speak; save();
  $("#btnSpeakAll").textContent = store.speak ? "🔊 发音开关" : "🔇 发音已关";
  toast(store.speak ? "已开启单词发音" : "已关闭单词发音");
  if(store.speak) speak("hello");
});
$("#btnReset").addEventListener("click", () => {
  if(!confirm("确定重置全部学习进度？词库本身不受影响。")) return;
  store = { st:{}, wr:{}, seen:{}, days:{}, speak:store.speak };
  save(); paintHeader(); render(); toast("学习进度已重置");
});

/* ==================== 启动 ==================== */
load();
$("#btnSpeakAll").textContent = store.speak ? "🔊 发音开关" : "🔇 发音已关";
paintHeader();
render();
</script>
</body>
</html>
